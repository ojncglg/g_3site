<!--
  Template: 500.html
  Purpose: Render a branded fallback when an internal server error occurs.
  Inherits: base.html (global head, navigation, footer, shared styles/scripts).

  Maintainer notes:
  - Keep <canvas id="matrix"> because static/matrix.js expects this id.
  - Keep tone reassuring; this page should acknowledge fault without exposing internals.
  - Keep one clear exit path (home CTA) so users can recover quickly.
-->
{% extends "base.html" %}
{% block title %}500, Internal Server Error{% endblock %}
{% block content %}
<!-- Matrix effect background -->
<canvas id="matrix"></canvas>
<script src="{{ url_for('static', filename='matrix.js') }}"></script>

<!-- Foreground content remains above canvas via z-index utility. -->
<section class="relative z-10 text-center py-24">
  <h1 class="text-6xl font-bold text-[color:var(--g3-gold)]">500</h1>
  <p class="mt-4 text-lg text-slate-300">
    Something went wrong on our side. Please try again later.
  </p>
  <a href="/" class="btn-gold mt-6 inline-block">Back to Home</a>
</section>
{% endblock %}
