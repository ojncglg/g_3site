<!--
  Template: 404.html
  Purpose: Render a branded "not found" experience when no route matches.
  Inherits: base.html (global head, navigation, footer, shared styles/scripts).

  Maintainer notes:
  - Keep <canvas id="matrix"> because static/matrix.js attaches to this exact id.
  - Keep recovery copy short; users on this page are already off their expected path.
  - Keep one primary CTA back to home to reduce decision friction.
-->
{% extends "base.html" %}
{% block title %}404, Page Not Found{% endblock %}
{% block content %}
<!-- Matrix effect background -->
<canvas id="matrix"></canvas>
<script src="{{ url_for('static', filename='matrix.js') }}"></script>

<!-- Foreground content remains above canvas via z-index utility. -->
<section class="relative z-10 text-center py-24">
  <h1 class="text-6xl font-bold text-[color:var(--g3-gold)]">404</h1>
  <p class="mt-4 text-lg text-slate-300">Sorry, we couldn’t find that page.</p>
  <a href="/" class="btn-gold mt-6 inline-block">Back to Home</a>
</section>
{% endblock %}
